apiVersion: apps/v1
kind: Deployment
metadata:
  name: metallb-test
  namespace: metallb-validation
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: metallb-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metallb-test
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: metallb-test
              topologyKey: kubernetes.io/hostname
      containers:
        - name: server
          image: busybox:1.37.0
          command: [sh, -c]
          args:
            - printf '%s\n' "$HOSTNAME" >/www/index.html; exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: content
              mountPath: /www
      volumes:
        - name: content
          emptyDir: {}
