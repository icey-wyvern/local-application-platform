apiVersion: v1
kind: Service
metadata:
  name: metallb-test
  namespace: metallb-validation
  annotations:
    metallb.io/address-pool: lab-general
    metallb.io/loadBalancerIPs: 10.20.0.101
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: metallb-test
  ports:
    - name: http
      port: 8080
      targetPort: http
