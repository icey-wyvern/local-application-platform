apiVersion: v1
kind: Pod
metadata:
  name: net-server-worker-2
  namespace: lap-networking-test
  labels:
    app.kubernetes.io/name: lap-networking-echo
spec:
  nodeName: worker-2
  automountServiceAccountToken: false
  restartPolicy: Always
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: server
      image: busybox:1.37.0
      imagePullPolicy: IfNotPresent
      command: [sh, -c]
      args:
        - echo worker-2 >/www/index.html && exec httpd -f -p 8080 -h /www
      ports:
        - name: http
          containerPort: 8080
      readinessProbe:
        httpGet:
          path: /
          port: http
        periodSeconds: 2
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: content
          mountPath: /www
  volumes:
    - name: content
      emptyDir: {}
