apiVersion: v1
kind: Pod
metadata:
  name: net-client-worker-3
  namespace: lap-networking-test
  labels:
    app.kubernetes.io/name: lap-networking-client
spec:
  nodeName: worker-3
  automountServiceAccountToken: false
  restartPolicy: Always
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: busybox:1.37.0
      imagePullPolicy: IfNotPresent
      command: [sleep, "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
