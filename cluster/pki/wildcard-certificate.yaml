apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: apps-wildcard
  namespace: envoy-gateway-system
spec:
  dnsNames:
    - "*.apps.lab.test"
  duration: 2160h
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: lap-cluster-intermediate
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    rotationPolicy: Always
    size: 2048
  renewBefore: 360h
  secretName: apps-wildcard-tls
  usages:
    - digital signature
    - key encipherment
    - server auth
