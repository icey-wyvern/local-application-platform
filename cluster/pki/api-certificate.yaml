apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api
  namespace: envoy-gateway-system
spec:
  secretName: api-tls
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - api.lab.test
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: lap-cluster-intermediate
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    rotationPolicy: Always
    size: 2048
  usages:
    - digital signature
    - key encipherment
    - server auth
