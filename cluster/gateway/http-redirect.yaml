apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apps-http-to-https
  namespace: envoy-gateway-system
spec:
  hostnames:
    - "*.apps.lab.test"
  parentRefs:
    - name: platform
      sectionName: http
  rules:
    - filters:
        - requestRedirect:
            scheme: https
            statusCode: 308
          type: RequestRedirect
