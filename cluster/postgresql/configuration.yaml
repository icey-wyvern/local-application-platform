apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-configuration
  namespace: platform-database
data:
  postgresql.conf: |
    listen_addresses = '*'
    port = 5432
    max_connections = 100
    shared_buffers = '256MB'
    work_mem = '4MB'
    maintenance_work_mem = '64MB'
    effective_cache_size = '768MB'
    wal_compression = on
    checkpoint_timeout = '10min'
    checkpoint_completion_target = 0.9
    min_wal_size = '80MB'
    max_wal_size = '1GB'
    logging_collector = off
    log_destination = 'stderr'
    log_line_prefix = '%m [%p] %q%u@%d '
    log_min_duration_statement = 500
    log_connections = on
    log_disconnections = on
    timezone = 'UTC'
    log_timezone = 'Europe/London'
    password_encryption = 'scram-sha-256'
    ssl = on
    ssl_cert_file = '/etc/postgresql/tls/tls.crt'
    ssl_key_file = '/etc/postgresql/tls/tls.key'
    ssl_min_protocol_version = 'TLSv1.2'
  pg_hba.conf: |
    local   all   all                  trust
    hostnossl all all 0.0.0.0/0       reject
    hostnossl all all ::/0             reject
    hostssl all all 0.0.0.0/0         scram-sha-256
    hostssl all all ::/0               scram-sha-256
  10-create-application-role.sh: |
    #!/bin/sh
    set -eu
    app_password=$(cat /run/secrets/application/password)
    psql --set=ON_ERROR_STOP=1 \
      --username "$POSTGRES_USER" \
      --dbname "$POSTGRES_DB" \
      --set=app_user="$POSTGRES_APP_USER" \
      --set=app_password="$app_password" <<'SQL'
    SELECT format(
      'CREATE ROLE %I LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION',
      :'app_user', :'app_password'
    ) WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'app_user') \gexec
    SELECT format('GRANT CONNECT ON DATABASE %I TO %I', current_database(), :'app_user') \gexec
    SELECT format('GRANT USAGE, CREATE ON SCHEMA public TO %I', :'app_user') \gexec
    SQL
