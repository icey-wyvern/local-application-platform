apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: platform-controller
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [platform-system]
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-controller
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
