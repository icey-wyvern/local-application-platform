---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: applications.platform.lab.test
spec:
  group: platform.lab.test
  names:
    kind: Application
    listKind: ApplicationList
    plural: applications
    shortNames:
    - app
    singular: application
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.releaseId
      name: Release
      type: string
    - jsonPath: .status.observedGeneration
      name: Observed
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ApplicationSpec is the complete user-facing desired-state
              contract.
            properties:
              healthPath:
                description: HealthPath is an absolute HTTP path without query string
                  or fragment.
                maxLength: 256
                minLength: 1
                pattern: ^/[^?#]*$
                type: string
                x-kubernetes-validations:
                - message: healthPath must not be a network-path reference
                  rule: '!self.startsWith(''//'')'
              image:
                description: Image is an immutable OCI image reference containing
                  a sha256 digest.
                maxLength: 2048
                pattern: ^.+@sha256:[0-9a-f]{64}$
                type: string
              port:
                description: Port is the validated application container port.
                format: int32
                maximum: 65535
                minimum: 1024
                type: integer
              releaseId:
                description: ReleaseID is the durable platform Release UUID.
                format: uuid
                type: string
              replicas:
                description: Replicas is fixed at two for the first platform version.
                format: int32
                maximum: 2
                minimum: 2
                type: integer
            required:
            - healthPath
            - image
            - port
            - releaseId
            - replicas
            type: object
          status:
            description: ApplicationStatus is entirely controller-owned.
            properties:
              activeReleaseId:
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentImage:
                type: string
              desiredImage:
                type: string
              hostname:
                type: string
              lastHealthCheckTime:
                format: date-time
                type: string
              lastTransitionTime:
                format: date-time
                type: string
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              observedRouteGeneration:
                format: int64
                type: integer
              phase:
                description: ApplicationPhase summarizes controller progress without
                  replacing Conditions.
                enum:
                - Pending
                - Ready
                - Error
                - Deleting
                type: string
              readyReplicas:
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name must be the lowercase DNS-safe application name
          rule: self.metadata.name.matches('^[a-z0-9]([a-z0-9-]{0,46}[a-z0-9])?$')
    served: true
    storage: true
    subresources:
      status: {}
