apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platform-api
  namespace: platform-system
spec:
  hostnames:
    - api.lab.test
  parentRefs:
    - name: platform
      namespace: envoy-gateway-system
      sectionName: api-https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - name: platform-api
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platform-api-http-to-https
  namespace: platform-system
spec:
  hostnames:
    - api.lab.test
  parentRefs:
    - name: platform
      namespace: envoy-gateway-system
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 308
