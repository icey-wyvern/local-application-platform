[project]
name = "lap-cli"
version = "1.0.0"
description = "Local Application Platform command line client"
requires-python = ">=3.14,<3.15"
dependencies = ["typer==0.19.2", "httpx==0.28.1"]

[project.scripts]
lap = "lap_cli.main:run"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
