[project]
name = "platform-build-agent"
version = "1.0.0"
description = "Secure build worker for the Local Application Platform."
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.117.1",
  "httpx==0.28.1",
  "opentelemetry-api==1.38.0",
  "opentelemetry-exporter-otlp-proto-http==1.38.0",
  "opentelemetry-instrumentation-fastapi==0.59b0",
  "opentelemetry-sdk==1.38.0",
  "prometheus-client==0.23.1",
  "pydantic==2.12.4",
  "pyyaml==6.0.2",
  "uvicorn==0.37.0",
]

[project.scripts]
lap-build-agent = "lap_build_agent.main:run"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lap_build_agent"]
