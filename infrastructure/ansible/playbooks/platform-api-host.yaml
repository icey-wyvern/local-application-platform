---
- name: Trust the private lab registry on workload nodes
  hosts: workers
  become: true
  gather_facts: false
  vars:
    lap_platform_api_pki_directory: "{{ lookup('ansible.builtin.env', 'PLATFORM_API_PKI_DIR') }}"
  tasks:
    - name: Require the external PKI directory
      ansible.builtin.assert:
        that:
          - lap_platform_api_pki_directory | length > 0
        fail_msg: PLATFORM_API_PKI_DIR must identify the generated external PKI directory.

    - name: Install the lab root CA for registry pulls
      ansible.builtin.copy:
        src: "{{ lap_platform_api_pki_directory }}/lab-root-ca.crt"
        dest: /usr/local/share/ca-certificates/local-application-platform-root.crt
        owner: root
        group: root
        mode: "0644"
      register: lap_platform_api_root_ca

    - name: Refresh system trust
      ansible.builtin.command:
        argv: [update-ca-certificates]
      when: lap_platform_api_root_ca.changed
      changed_when: true

    - name: Restart containerd after trust changes
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted
      when: lap_platform_api_root_ca.changed
