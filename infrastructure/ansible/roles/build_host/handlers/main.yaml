---
- name: Reload build-host systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: reload build-host systemd

- name: Apply rootless BuildKit sysctl
  ansible.builtin.command:
    argv: [sysctl, --system]
  changed_when: true
  listen: apply rootless BuildKit sysctl
  notify: restart BuildKit

- name: Restart registry
  ansible.builtin.systemd_service:
    name: lap-registry
    state: restarted
  listen: restart registry

- name: Restart BuildKit
  ansible.builtin.systemd_service:
    name: lap-buildkit
    state: restarted
  listen: restart BuildKit

- name: Restart build agent
  ansible.builtin.systemd_service:
    name: lap-build-agent
    state: restarted
  listen: restart build agent

- name: Reload build-host nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded
  listen: reload build-host nftables
